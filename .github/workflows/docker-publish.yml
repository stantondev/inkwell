name: Publish Docker Images

# Self-hosters pull these images. Each push builds images tagged with the
# commit, boots them with docker-compose.selfhosted.yml at a made-up domain
# (scripts/selfhost-smoke.sh), and only then moves :latest. A build that
# breaks self-hosting never becomes :latest.

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/stantondev/inkwell-api:${{ github.sha }}

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/stantondev/inkwell-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=

  smoke-test:
    name: Self-hosting smoke test
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the self-hosted stack and check it
        env:
          API_IMAGE: ${{ env.REGISTRY }}/stantondev/inkwell-api:${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/stantondev/inkwell-web:${{ github.sha }}
        run: scripts/selfhost-smoke.sh

  promote:
    name: Tag as latest
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Point :latest at the tested images
        run: |
          for image in inkwell-api inkwell-web; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/stantondev/$image:latest \
              ${{ env.REGISTRY }}/stantondev/$image:${{ github.sha }}
          done
