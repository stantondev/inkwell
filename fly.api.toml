# ──────────────────────────────────────────────────────────────
# Fly.io config for Inkwell Phoenix API
# Deploy with: fly deploy --config fly.api.toml
# ──────────────────────────────────────────────────────────────

app = "inkwell-api"
primary_region = "ord"

[build]
  dockerfile = "apps/api/Dockerfile"
  [build.args]
    ELIXIR_VERSION = "1.18.4"
    OTP_VERSION = "27.3.4"

[env]
  PORT = "4000"
  PHX_HOST = "inkwell-api.fly.dev"
  # The database (inkwell-db) has 1 GB, and each open connection costs it
  # ~27 MB of private memory (measured 2026-10-23). At 12 connections that was
  # ~350 MB and free memory kept dipping under the 100 MB alert line; during a
  # blue-green deploy both pools are open at once. 8 is plenty for Inkwell's
  # traffic: Oban jobs spend most of their time on HTTP, not holding a
  # connection, and the connections were all idle when measured.
  POOL_SIZE = "8"

# Blue-green: boot the new machine(s), wait for health checks, then switch
# traffic and retire the old ones. No extra standing cost.
# The API runs on one machine, so the default rolling strategy stopped it
# before starting the new one: every deploy was a 30-60s outage, and pages
# rendered during it treated signed-in people as signed out (2026-09-19).
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
