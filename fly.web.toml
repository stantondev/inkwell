# ──────────────────────────────────────────────────────────────
# Fly.io config for Inkwell Next.js Frontend
# Deploy with: fly deploy --config fly.web.toml
# ──────────────────────────────────────────────────────────────

app = "inkwell-web"
primary_region = "ord"

[build]
  dockerfile = "apps/web/Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://api.inkwell.social"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  API_URL = "https://api.inkwell.social"

# Blue-green: boot the new machine(s), wait for health checks, then switch
# traffic and retire the old ones. No extra standing cost.
# Rolling deploys left one machine on the old build and one on the new for
# ~30s, so a page from one could request JS chunks that only exist on the other.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/api/healthcheck"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
